# Camera configuration for RK3588S.
# The board has IMX415 sensors connected via MIPI CSI to rkisp ISP.
# Use v4l2-ctl --list-devices to find the correct video node.

camera_enabled=true

# V4L2 device path. On this board, the active IMX415 pipeline uses rkisp0-vir1 mainpath: /dev/video42
camera_device=/dev/video42

# Capture resolution. Must be within the ISP output range (32x32 to 800x600).
camera_width=800
camera_height=600

# Pixel format. NV12 is preferred for RK3588S ISP output.
# Supported: NV12, NV21, NV16, NV61, UYVY
camera_format=NV12

# Number of V4L2 buffers to request.
camera_buffer_count=4

# Target frames per second. Actual FPS depends on sensor and ISP settings.
camera_fps=30

# ---------------------------------------------------------------------------
# Media source selection (task: software end-to-end loop without camera).
# sourceType controls which frame source drives the pipeline when no real
# camera is connected:
#   v4l2          - real V4L2 camera (struct default, backward compatible)
#   test_pattern  - generate NV12 color bars + moving square in software
#   file          - read raw NV12 frames from a file (loop supported)
# When sourceType != v4l2, camera_device is ignored and the configured
# camera_width/height/fps are reused as the source dimensions.
# ---------------------------------------------------------------------------
media_source_type=v4l2
media_file_path=/opt/car-terminal/testdata/sample.nv12
media_file_loop=true

# Per-lane queue depth (GUI/RKNN/RTSP each get their own bounded queue).
# drop_oldest policy is applied when a queue is full.
media_queue_capacity=3

# Capture-thread lifecycle and media-source read timeouts (milliseconds).
media_start_timeout_ms=5000
media_read_timeout_ms=500
media_stop_timeout_ms=3000
