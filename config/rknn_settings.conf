# RKNN NPU object detection configuration.
# Requires yolov5s.rknn model file and librknnrt.so on the system.

# Enable RKNN NPU object detection (Phase 1 task 2, 2026-07-20).
# Static image validation: bus.jpg → 4 persons + 1 bus at conf=0.25/nms=0.45.
rknn_enabled=true

# Path to YOLOv5s RKNN model file.
rknn_model_path=config/yolov5s.rknn
rknn_metadata_path=config/yolov5s_metadata.conf

# Model input dimensions (YOLOv5s default: 640x640).
rknn_model_width=640
rknn_model_height=640

# Confidence threshold for detection filtering.
# 0.25 = ultralytics official default, balances recall and precision.
# Previous 0.45 caused missed detections of distant/partial persons in bus.jpg.
rknn_conf_threshold=0.25

# NMS IoU threshold for overlapping box suppression.
# 0.45 = ultralytics official default, prevents over-merging nearby persons.
rknn_nms_threshold=0.45
