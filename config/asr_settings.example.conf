# ASR (Automatic Speech Recognition) configuration template.
#
# Copy this file to asr_settings.conf and fill in your own Baidu ASR token/cuid.
# Do NOT commit the real asr_settings.conf with real credentials.
#
# Priority of config path resolution:
#   1. Environment variable VEHICLE_ASR_CONFIG=/path/to/asr_settings.conf
#   2. config/asr_settings.conf (this directory)
#   3. Missing file -> online ASR disabled by default (safe)
#
# Note: the in-process offline ASR (sherpa-onnx) is configured separately via
# config/asr_settings_offline.conf and config/voice_settings.conf.

asr_enabled=false
asr_api_url=http://vop.baidu.com/server_api
asr_token=YOUR_ASR_TOKEN
asr_cuid=YOUR_ASR_CUID
asr_format=pcm
asr_rate=16000
asr_channel=1
asr_record_path=./record.wav
asr_timeout_ms=5000
