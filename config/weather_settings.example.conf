# Weather configuration template for RK3588S migration.
#
# Copy this file to weather_settings.conf and fill in your own credentials.
# Do NOT commit the real weather_settings.conf with real secrets.
#
# Priority of config path resolution:
#   1. Environment variable VEHICLE_WEATHER_CONFIG=/path/to/weather_settings.conf
#   2. config/weather_settings.conf (this directory)
#   3. Missing file -> weather disabled by default (safe)

weather_enabled=false
weather_url_template=http://v1.yiketianqi.com/free/week?appid={appid}&appsecret={appsecret}&city={city}
weather_appid=YOUR_WEATHER_APP_ID
weather_appsecret=YOUR_WEATHER_APP_SECRET
weather_city=Shenyang
weather_timeout_ms=10000
