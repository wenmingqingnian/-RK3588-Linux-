# MP4 video recording configuration
# Default: enabled (auto-starts with RTSP server)
#
# The recorder consumes the Annex-B byte stream already produced by the
# RTSP encoder (MPP hardware or libx264 fallback), so enabling recording
# adds zero encoding overhead. Files are written to <output_dir> as
# <filename_prefix>_NNNN.mp4 and rotated every <segment_duration_sec> seconds.
# When the total segment count exceeds <max_segments>, the oldest file is
# deleted automatically (FIFO cleanup).
#
# Note: codec / width / height / fps are inherited from the RTSP config
# (rtsp_settings.conf). Do NOT set them here — they are overwritten by
# RtspServer::init() to match the encoded stream exactly.

recording_enabled=true
recording_output_dir=recordings
recording_filename_prefix=record
# Each MP4 segment is closed and a new one opened at this interval.
# Switching always happens at a keyframe (IDR) boundary so every segment
# is independently seekable.
recording_segment_duration_sec=60
# Keep at most N segments on disk. Older files are deleted FIFO.
recording_max_segments=10
