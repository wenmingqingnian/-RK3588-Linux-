# Static map configuration for RK3588S migration.
# Keep network URL and API key out of GUI source files.
#
# This file is committed with a safe placeholder. To enable real map
# requests, copy map_settings.example.conf over this file and fill in
# your own Baidu Map API key, or point VEHICLE_MAP_CONFIG to a private file.
# Placeholder values (YOUR_*) are treated as invalid and disable requests.

map_url_template=http://api.map.baidu.com/staticimage/v2?ak={ak}&width={width}&height={height}&scale={scale}&copyright={copyright}&center={center}&markers={markers}&zoom={zoom}&coordtype=wgs84ll
map_enabled=true
map_api_key=YOUR_BAIDU_MAP_KEY
map_default_center=123.43147,41.80570
map_default_zoom=10
map_min_zoom=3
map_max_zoom=18
map_width=1024
map_height=600
map_scale=1
map_copyright=1
map_markers_enabled=true
map_output_file=map.png
