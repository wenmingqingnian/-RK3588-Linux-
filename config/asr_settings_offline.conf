# Offline ASR (sherpa-onnx) configuration.
# Uses dlopen to load sherpa-onnx shared libraries at runtime.

asr_enabled=true

# Model paths (relative to application working directory)
asr_model_path=./config/sherpa-onnx-model/
asr_tokens_path=./config/sherpa-onnx-model/tokens.txt
asr_encoder_path=./config/sherpa-onnx-model/encoder-epoch-99-avg-1.int8.onnx
asr_decoder_path=./config/sherpa-onnx-model/decoder-epoch-99-avg-1.int8.onnx
asr_joiner_path=./config/sherpa-onnx-model/joiner-epoch-99-avg-1.int8.onnx

# Audio parameters
asr_sample_rate=16000
asr_num_threads=2

# ALSA device name for microphone input
# Use 'arecord -l' on the board to list available capture devices
# QuarkPi-CA2 built-in codec ES8323 record path broken (I2C comm failure),
# use USB camera microphone instead: plughw:3,0 (card3, stereo, hw:0,2 for IG hilarious)
# NOTE: plughw is lazy-start — needs blocking priming readi in VoiceManager.
asr_alsa_device=plughw:3,0

# Contextual biasing for fixed cabin commands
# decoding_method: greedy_search | modified_beam_search
# hotwords_file: UTF-8 no BOM, space-separated tokens, one phrase per line
# hotwords_score: >0, default 1.5 (adjust 1.5 -> 2.0 -> 2.5 if accuracy < 6/6)
# 2.5 chosen to reduce false positives from TTS echo / environmental noise
# now that TTS feedback is enabled (echo loop suppression via ASR mute
# is the primary defense; higher hotwords_score is a secondary guard).
asr_decoding_method=modified_beam_search
asr_hotwords_file=./config/asr_hotwords.txt
asr_hotwords_score=2.5
