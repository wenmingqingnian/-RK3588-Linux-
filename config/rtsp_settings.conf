# RTSP streaming server configuration
# Default: disabled (set rtsp_enabled=true to enable)

rtsp_enabled=true
rtsp_port=8554
rtsp_stream_path=/live
rtsp_width=800
rtsp_height=600
# 对齐 IMX415 采集帧率（camera_fps=30），避免编码器降帧采样导致画面卡顿
rtsp_fps=30
rtsp_bitrate=2000000
# GOP 对齐 fps（每秒一个 I 帧），VLC 拉流首帧解码更快
rtsp_gop_size=30
# Codec: "264" (H.264) or "265" (H.265). Used with MPP hardware encoder.
rtsp_codec=264
