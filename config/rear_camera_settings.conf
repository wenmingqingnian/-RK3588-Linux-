# P2 Rear camera policy.
# Verified chain: imx335 2-001a -> rkisp0-vir1 -> /dev/video42.
# Capture starts only while the REVERSE vehicle signal is active.
# Opening Monitor alone does not power IMX335.
camera_enabled=true
camera_device=/dev/video42
camera_width=800
camera_height=600
camera_format=NV12
camera_buffer_count=4
camera_fps=30
media_source_type=v4l2
media_file_path=
media_file_loop=true
media_queue_capacity=3
media_start_timeout_ms=5000
media_read_timeout_ms=500
media_stop_timeout_ms=3000
