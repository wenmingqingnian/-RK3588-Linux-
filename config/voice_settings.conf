# Voice interaction configuration.
# All paths are relative to the application working directory.
#
# On the board, build voice services first:
#   mkdir -p <BUILD_DIR> && cd <BUILD_DIR>
#   cmake <PROJECT_DIR>/voice && make -j$(nproc)
#
# Then deploy:
#   cp <BUILD_DIR>/llm_service <PROJECT_DIR>/
#   cp <BUILD_DIR>/tts_service <PROJECT_DIR>/
#   cp <BUILD_DIR>/libzmq_component.so <PROJECT_DIR>/

# === 语音总开关 ===
# false: 整个语音管线不启动，isReady()=false，程序继续运行。
# true:  按下面的独立开关分别初始化 ASR / LLM / TTS。
voice_enabled=true

# === 固定指令直连 GUI ===
# true: ASR 文本先经 vehiclecommand 关键词匹配，命中则直接控制 GUI，
#       绝不发送给 LLM（双路径之一）。
# true 是安全默认：不依赖 NPU/LLM 即可实现地图/摄像头/音乐/天气控制。
direct_command_enabled=true

# === 本地大模型开关 ===
# false: 不启动 llm_service，不创建 ZMQ Client，不加载 RKLLM 模型，
#        不访问 NPU 驱动。
# !! 当前 NPU 驱动 v0.9.6 触发 SIGBUS，必须保持 false !!
# !! 升级驱动到 v0.9.7+ 之前禁止改为 true !!
llm_enabled=false

# === TTS 独立开关 ===
# false: 不启动 tts_service。
# true:  启动 tts_service，配合 tts_feedback_for_command 实现语音闭环。
tts_enabled=true

# === 固定指令 TTS 反馈开关 ===
# true:  固定指令命中后，VoiceManager 直接将反馈文本（如"已为您打开地图"）
#        通过 ZMQ 发送给 tts_service 播报，无需 LLM 参与。
#        仅在 tts_enabled=true 时生效。
#        tts_service 在 llm_enabled=false 时自动以 --direct 模式启动，
#        跳过 6677 状态信号握手。
# false: 命中指令仅执行 GUI 动作，不播报语音。
tts_feedback_for_command=true

# === TTS 反馈期间 ASR 静音窗口（毫秒） ===
# sendToTts() 调用时立即静音 ASR（仍读 ALSA 但不喂识别引擎，防止录到
# TTS 自己声音形成回环）。TTS ack 返回后保持静音此毫秒数，覆盖实际
# 合成+播放时段。RK3588S 上 6 字短句约 1-2 秒播完，3000ms 为安全余量。
# 设 0 可禁用静音（仅用于调试，会有回环风险）。
# 调试技巧：日志里看 "ASR muted for TTS feedback" 和 "ASR unmuted" 两条
# 配对，确认窗口是否覆盖整个 TTS 播放。
tts_feedback_mute_ms=3000

# === 固定指令无法匹配时是否尝试 LLM ===
# true:  Unknown 文本在 LLM 可用时转发给 LLM（双路径之二）。
# false: Unknown 文本不转发，仅记录日志。
# 注意：仅当 llm_enabled=true 且 LLM 进程运行时此开关才生效。
unknown_command_fallback_to_llm=true

# LLM service (DeepSeek-R1-Distill-Qwen-1.5B via RKNN-LLM)
# Path to the llm_service executable (relative to CarTerminal working dir)
llm_bin_path=./llm_service
llm_model_path=./config/DeepSeek-R1-Distill-Qwen-1.5B_W8A8_RK3588.rkllm

# TTS service (SummerTTS)
# Path to the tts_service executable (relative to CarTerminal working dir)
tts_bin_path=./tts_service
tts_model_path=./config/single_speaker_fast.bin

# ASR configuration file path
asr_config_path=./config/asr_settings_offline.conf

# KWS configuration file path (optional)
# When set AND the referenced config has kws_enabled=true, VoiceManager
# enables a two-stage wake-word-gated ASR flow:
#   1. KWS_LISTEN: continuously monitor microphone for wake word.
#   2. ASR_WINDOW: on wake-word hit, open a short ASR recognition window
#      (6s timeout), then return to KWS_LISTEN.
# When empty or kws_enabled=false, VoiceManager falls back to the legacy
# continuous-ASR flow (every PCM chunk is fed to ASR).
# Leave empty to disable KWS (current default until KWS model is deployed).
kws_config_path=./config/kws_settings.conf

# ZMQ communication addresses
# Use 127.0.0.1 instead of localhost: on the board /etc/hosts may be missing
# the localhost entry, causing ZMQ recv to hang for zmq_timeout_ms (30s).
# 127.0.0.1 always resolves without /etc/hosts dependency.
llm_address=tcp://127.0.0.1:6666
tts_address=tcp://127.0.0.1:7777
tts_status_address=tcp://127.0.0.1:6677

# ZMQ timeout in milliseconds
zmq_timeout_ms=30000
