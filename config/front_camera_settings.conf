# P2 Front camera baseline.
# Physical mapping revalidated on 2026-08-19: Front = IMX415 on CAM3.
# Verified chain: imx415 1-001a -> csi2-dphy0 -> rkisp0-vir0 -> /dev/video33.
camera_enabled=true
camera_device=/dev/video33
camera_width=800
camera_height=600
camera_format=NV12
camera_buffer_count=4
camera_fps=30
media_source_type=v4l2
media_file_path=
media_file_loop=true
media_queue_capacity=3
media_start_timeout_ms=5000
media_read_timeout_ms=500
media_stop_timeout_ms=3000
