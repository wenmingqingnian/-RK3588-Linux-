# KWS (Keyword Spotting / wake word detection) configuration.
# Uses sherpa-onnx KeywordSpotter via dlopen (same library as ASR).
#
# When kws_enabled=true AND voice_settings.conf has kws_config_path pointing
# to this file, VoiceManager runs a two-stage flow:
#   1. KWS_LISTEN: continuously monitor microphone for wake word.
#   2. ASR_WINDOW: on wake-word hit, open a short ASR recognition window
#      (6s timeout) and emit asrTextRecognized() with the recognized text.
# When kws_enabled=false (or this file is not referenced), VoiceManager
# falls back to the legacy continuous-ASR flow.
#
# Recommended model: sherpa-onnx-kws-zipformer-wenetspeech-3.3M-2024-01-01
# (Chinese, int8 quantized, ~5MB, runs on CPU).

kws_enabled=false

# Model paths (relative to application working directory)
# Same directory layout as the ASR model — KWS uses its own encoder/decoder/joiner.
kws_model_path=./config/sherpa-onnx-kws-model/
kws_tokens_path=./config/sherpa-onnx-kws-model/tokens.txt
kws_encoder_path=./config/sherpa-onnx-kws-model/encoder-epoch-12-avg-4-chunk-ctx-left-64.int8.onnx
kws_decoder_path=./config/sherpa-onnx-kws-model/decoder-epoch-12-avg-4-chunk-ctx-left-64.int8.onnx
kws_joiner_path=./config/sherpa-onnx-kws-model/joiner-epoch-12-avg-4-chunk-ctx-left-64.int8.onnx

# Keywords file (UTF-8 no BOM)
# Format: "<token sequence> @<display name>" per line
# Token style: ppinyin with tone numbers (matches wenetspeech model tokens.txt)
# Examples:
#   ni3 hao3 xiao3 wen4 @你好小问
#   ni3 hao3 xiao3 zhi4 @你好小智
kws_keywords_file=./config/kws_keywords.txt

# Audio parameters
kws_sample_rate=16000
kws_num_threads=2

# KWS tuning (see sherpa-onnx KWS docs):
#   kws_keywords_score:    token bonus; raise to reduce misses, lower to
#                          reduce false alarms. Typical 1.0-2.0.
#   kws_keywords_threshold: trigger threshold in [0,1]; raise to reduce
#                          false alarms. Typical 0.1-0.5.
#   kws_max_active_paths:  modified_beam_search beam width (default 4).
#   kws_num_trailing_blanks: blank frames after keyword before firing.
#                          Raise to ~8 if multi-syllable words overlap.
kws_keywords_score=1.5
kws_keywords_threshold=0.25
kws_max_active_paths=4
kws_num_trailing_blanks=1
