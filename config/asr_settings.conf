# ASR (Automatic Speech Recognition) configuration.
# Keep API URL, token, and cuid out of source code.
#
# This file is committed with safe placeholders. To enable online ASR,
# copy asr_settings.example.conf over this file and fill in your own
# Baidu ASR credentials, or point VEHICLE_ASR_CONFIG to a private file.
# Placeholder values (YOUR_*) are treated as invalid and disable requests.
#
# Note: the in-process offline ASR (sherpa-onnx) is configured separately via
# config/asr_settings_offline.conf and config/voice_settings.conf.

asr_enabled=false
asr_api_url=http://vop.baidu.com/server_api
asr_token=YOUR_ASR_TOKEN
asr_cuid=YOUR_ASR_CUID
asr_format=pcm
asr_rate=16000
asr_channel=1
asr_record_path=./record.wav
asr_timeout_ms=5000
