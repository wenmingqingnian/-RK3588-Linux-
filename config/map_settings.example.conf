# Static map configuration template for RK3588S migration.
#
# Copy this file to map_settings.conf and fill in your own Baidu Map API key.
# Do NOT commit the real map_settings.conf with a real API key.
#
# Priority of config path resolution:
#   1. Environment variable VEHICLE_MAP_CONFIG=/path/to/map_settings.conf
#   2. config/map_settings.conf (this directory)
#   3. Missing file -> map uses safe defaults (no network request)

map_enabled=false
map_url_template=http://api.map.baidu.com/staticimage/v2?ak={ak}&width={width}&height={height}&scale={scale}&copyright={copyright}&center={center}&markers={markers}&zoom={zoom}&coordtype=wgs84ll
map_api_key=YOUR_BAIDU_MAP_KEY
map_default_center=123.43147,41.80570
map_default_zoom=10
map_min_zoom=3
map_max_zoom=18
map_width=1024
map_height=600
map_scale=1
map_copyright=1
map_markers_enabled=true
map_output_file=map.png
