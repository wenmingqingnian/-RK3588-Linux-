# Device configuration for RK3588S migration.
# Key input is disabled by default so the GUI can start without IMX6ULL /dev/key.

key_input_enabled=false
key_input_device=
key_input_pressed_value=240
key_input_poll_interval_ms=500

# GPS serial input. ATGM336H-5N is wired to J11 Pin 8/10 = UART5_M1
# (GPIO3_C4/C5), which on this board enumerates as /dev/ttyS5.
gps_enabled=true
gps_device=/dev/ttyS5
gps_baudrate=9600
gps_data_bits=8
gps_parity=N
gps_stop_bits=1
gps_read_timeout_ms=500
gps_update_interval_ms=1000

# GPS simulation playback. Mutually exclusive with real GPS: enabling both at
# once is rejected at parse time. Both default to false so the shipping
# configuration never accesses the serial port or a simulation file.
# To test simulation on the board, set gps_simulation_enabled=true and point
# gps_simulation_file to the bundled NMEA route.
gps_simulation_enabled=false
gps_simulation_file=tests/gps/data/simulated_route.nmea
gps_simulation_interval_ms=500
gps_map_update_interval_ms=1000

# DHT11 temperature/humidity sensor is disabled by default.
# Linux 主线 DHT11 驱动 (drivers/iio/humidity/dht11.c) 是 IIO 子系统，不创建
# /dev/dht11 字符设备，数据通过 sysfs 暴露在 /sys/bus/iio/devices/iio:deviceN/。
# 启用步骤：
#   1. 内核开 CONFIG_DHT11（=y 或 =m + modprobe dht11）
#   2. 设备树加 dht11: humidity-sensor { compatible="dht11"; gpios=<&gpioX pin 0>; };
#   3. 板端执行 `ls /sys/bus/iio/devices/` 找到 iio:deviceN，cat name 应为 "dht11"
#   4. dht11_sysfs_dir 留空：自动扫描 /sys/bus/iio/devices/iio:device*/name=="dht11"
#      或显式填 dht11_sysfs_dir=/sys/bus/iio/devices/iio:deviceN
# 通道文件名 (in_temp_input / in_humidityrelative_input) 由代码内部常量固定，
# 不再作为配置项。数据单位：毫摄氏度 (25000=25°C)，毫百分 (60000=60%RH)。
dht11_enabled=true
dht11_sysfs_dir=
dht11_poll_interval_ms=2000

# AP3216C ambient-light/proximity/infrared sensor.
# Backend selection is startup-only; restart CarTerminal after changing it.
#   iio      = auto-discover name==ap3216c, read sysfs channels and IIO events
#   user_i2c = access /dev/i2c-3 directly; first unbind kernel driver 3-001e
ap3216_enabled=true
ap3216_backend=iio
ap3216_sysfs_dir=
ap3216_als_file=in_illuminance_raw
ap3216_ps_file=in_proximity_raw
ap3216_ir_file=in_intensity_ir_raw
ap3216_use_iio_events=true
ap3216_i2c_device=/dev/i2c-3
ap3216_i2c_address=0x1e
ap3216_poll_interval_ms=500
# Board-validated hysteresis pair used in the final IRQ/IIO-event regression.
ap3216_ps_falling_threshold=50
ap3216_ps_rising_threshold=100

# Active buzzer verified on QuarkPi-CA2 GPIO4_A3.
# Hardware: /dev/gpiochip4, line offset 3.
# active_low=true: low level = beep, high level = silent.
buzzer_enabled=true
buzzer_gpio_chip=/dev/gpiochip4
buzzer_gpio_line=3
buzzer_active_low=true

# MPU6050 6-axis IMU on I2C3 (QuarkPi-CA2 J11 40Pin Pin 3=SDA, Pin 5=SCL).
# Wiring: VCC=3.3V (Pin 1), GND=Pin 9, SDA=Pin 3 (I2C3_SDA), SCL=Pin 5 (I2C3_SCL), AD0=GND.
# Verification: `sudo i2cdetect -y 3` should show 0x68.
# Disabled by default until hardware is wired and i2cdetect confirms 0x68.
#
# Defaults: 50 Hz polling, ±500 dps gyro, ±4g accel, 44 Hz DLPF.
# These ranges cover typical vehicle dynamics (±5g braking, ±400°/s yaw).
mpu6050_enabled=true
mpu6050_i2c_device=/dev/i2c-3
mpu6050_i2c_address=0x68
mpu6050_poll_interval_ms=20
mpu6050_gyro_range_dps=500
mpu6050_accel_range_g=4
mpu6050_dlpf_bandwidth_hz=44
# 数据源后端选择（第4周 IIO 适配）：
#   user_i2c   = 旧实现，读 /dev/i2c-3 + i2c_smbus_*（需 mpu6050_i2c_device）
#   iio_buffer = 新实现，读 /dev/iio:deviceX triggered buffer（内核 IIO 驱动已启用时用）
mpu6050_backend=iio_buffer
